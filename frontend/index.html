<!doctype html>
<html lang="es" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torneo Interfarmacéutico</title>
  </head>
  <style>
    body { margin: 0; background-color: #1e3a5f; }
    #initial-loader {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background-color: #1e3a5f; color: #fbbf24; font-family: sans-serif; z-index: 99999;
    }
    .spinner {
      width: 50px; height: 50px; border: 5px solid rgba(251, 191, 36, 0.3);
      border-radius: 50%; border-top-color: #fbbf24;
      animation: spin 1s ease-in-out infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      font-size: 14px; font-weight: bold; letter-spacing: 0.2em; text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.5; } }
  </style>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="loader-text">Inicializando Sistema...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
